[package]
name = "clamavui"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
description = "Graphical front end for the ClamAV virus scanner"

[dependencies]
eframe = "0.36"
egui = "0.36"
egui_extras = "0.36"
rfd = "0.17"
trash = "5"
directories = "6"
which = "8"
chrono = "0.4"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
opener = "0.8"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
